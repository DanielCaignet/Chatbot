# T014 (SPEC-001, FR-012): proxy de salida con lista blanca. Descartable.
# Hermes no tiene ruta a Internet; solo habla con este proxy, y el proxy solo deja pasar
# conexiones HTTPS (CONNECT al puerto 443) al proveedor de modelos. La MCP está en la red
# interna y no pasa por aquí. Referencia: https://wiki.squid-cache.org/SquidFaq/SquidAcl
http_port 3128

acl proveedor dstdomain openrouter.ai
acl puerto_seguro port 443
acl metodo_connect method CONNECT

http_access allow metodo_connect proveedor puerto_seguro
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
