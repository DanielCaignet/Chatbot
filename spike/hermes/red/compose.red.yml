# T014 (SPEC-001, FR-012, R10): contención de red de Hermes. Se suma a ../compose.yml:
#   docker compose --env-file ../../.env -f ../compose.yml -f compose.red.yml up -d --no-start
#   docker cp ../config.yaml hermes-spike:/opt/data/config.yaml
#   docker compose --env-file ../../.env -f ../compose.yml -f compose.red.yml start
# (ejecutar desde spike/hermes/red/)
#
# hermes-net pasa a ser interna: sin ruta a Internet. El proveedor se alcanza solo por el proxy.
# `puerta` reenvía 127.0.0.1:8642 de la VM a Hermes, porque Docker no publica puertos de redes internas.

services:
  hermes:
    ports: !reset []
    environment:
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: toolbox,localhost,127.0.0.1
    depends_on:
      - proxy

  proxy:
    image: ubuntu/squid:6.6-24.04_edge   # soporta arm64; registrar el digest en resultados.md (FR-004)
    container_name: proxy-spike
    restart: "no"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro   # el montaje es del proxy, no de Hermes
    networks:
      hermes-net:
        aliases: [proxy]
      salida: {}
    mem_limit: 256m

  puerta:
    image: alpine/socat:latest   # sin versión fija a propósito: solo reenvía un puerto en el spike
    container_name: puerta-spike
    restart: "no"
    command: tcp-listen:8642,fork,reuseaddr tcp:hermes:8642
    ports:
      - "127.0.0.1:8642:8642"
    networks:
      - hermes-net
      - salida
    depends_on:
      - hermes
    mem_limit: 64m

networks:
  hermes-net:
    internal: true
  salida: {}
